name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  APP_ENV: testing
  CACHE_DRIVER: array
  QUEUE_CONNECTION: sync

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, simplexml, xml, xmlwriter
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: cp .env.example .env

      - name: Check PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -r -n1 php -l

      - name: Boot the application
        run: php artisan --version

  tests:
    name: Tests (90% pass threshold)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, simplexml, xml, xmlwriter
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: cp .env.example .env

      - name: Run PHPUnit and enforce the pass threshold
        shell: bash
        run: |
          mkdir -p build
          phpunit_status=0
          vendor/bin/phpunit --log-junit build/junit.xml || phpunit_status=$?
          printf 'PHPUnit exit code: %s; checking the 90%% threshold from its report.\n' "$phpunit_status"
          php .github/scripts/check-test-threshold.php build/junit.xml 90

  lint:
    name: Laravel Pint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP and Laravel Pint
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: pint

      - name: Check code style
        run: pint --test
